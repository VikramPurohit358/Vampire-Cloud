name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Master server ─────────────────────────────────────────────────────────
  master:
    name: Master — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: master/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: node --check src/config.js src/logger.js src/state.js src/utils.js src/scheduler.js src/telemetry.js src/server.js

  # ─── Dashboard ─────────────────────────────────────────────────────────────
  dashboard:
    name: Dashboard — type-check & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint

  # ─── Worker ────────────────────────────────────────────────────────────────
  worker:
    name: Worker — lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install websockets ruff mypy
      - name: Ruff lint
        run: ruff check worker/
      - name: Mypy type-check
        run: mypy worker/ --ignore-missing-imports

  # ─── Docker build smoke test ───────────────────────────────────────────────
  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [master, dashboard, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build master
        uses: docker/build-push-action@v6
        with:
          context: .
          file: master/Dockerfile
          push: false
          tags: vampire-cloud-master:ci
      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: false
          tags: vampire-cloud-worker:ci
